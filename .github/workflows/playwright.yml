name: Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      LOGIN_PATH: ${{ secrets.LOGIN_PATH }}
      DASHBOARD_PATH: ${{ secrets.DASHBOARD_PATH }}
      PROTECTED_PATH: ${{ secrets.PROTECTED_PATH }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
      HEALTH_ENDPOINT: ${{ secrets.HEALTH_ENDPOINT }}
      PROFILE_ENDPOINT: ${{ secrets.PROFILE_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint:types
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
